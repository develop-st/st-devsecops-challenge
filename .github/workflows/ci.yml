name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Backend - setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Backend - build
        working-directory: backend
        run: ./gradlew clean build

      # SECURITY: Run dependency vulnerability scan
      - name: Backend - dependency check
        working-directory: backend
        run: ./gradlew dependencyCheckAnalyze || true

      - name: Frontend - setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend - install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # SECURITY: Run npm audit to check for vulnerabilities
      - name: Frontend - security audit
        working-directory: frontend
        run: npm audit --audit-level=high || true

      # SECURITY FIX: Use OIDC instead of long-lived access keys
      # Original code leaked env vars with: env | sort | sed -n '1,120p'
      # This exposed AWS credentials in logs!
      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Deploy (placeholder)
        if: github.ref == 'refs/heads/main'
        run: echo "Deploying to production... (placeholder)"
